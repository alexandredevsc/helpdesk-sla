# Nome apresentado nos logs do Spring Boot.
spring.application.name=helpdesk-sla-api

# A conexão é montada com variáveis de ambiente.
# Nenhum endereço, usuário ou senha ficará salvo no GitHub.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Driver responsável pela comunicação com o MySQL.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Nesta etapa ainda não existem entidades.
# Posteriormente controlaremos a estrutura do banco com migrations.
spring.jpa.hibernate.ddl-auto=validate

# Evita manter a sessão do banco aberta durante a resposta HTTP.
spring.jpa.open-in-view=false

# Exibe comandos SQL durante o desenvolvimento.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disponibiliza o endpoint usado para verificar a saúde da API.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never